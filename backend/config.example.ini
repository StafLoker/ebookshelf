[server]
port           = 7717  ; optional, default: 7717
max_upload_mb  = 100  ; optional, default: 100

[security]
secret_key     = change-me  ; required, 32 bytes in base64 (openssl rand -base64 32)
encryption_key = change-me  ; required, 32 bytes in base64 (openssl rand -base64 32)

[log]
; Minimum log level. Valid values: DEBUG, INFO, WARNING, ERROR
; level = INFO  ; optional, default: INFO

[paths]
; data_dir = /var/lib/ebookshelf  ; optional, default: /var/lib/ebookshelf
